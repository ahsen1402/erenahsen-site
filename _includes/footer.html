<footer class="site-footer">
  <div class="page__footer">
    <footer>
      <div class="page__footer-follow">
        <ul class="social-icons">
          {% if site.author.googlescholar %}<li><a href="{{ site.author.googlescholar }}"><i class="fas fa-graduation-cap" aria-hidden="true"></i> Google Scholar</a></li>{% endif %}
          {% if site.author.github %}<li><a href="https://github.com/{{ site.author.github }}"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a></li>{% endif %}
        </ul>
      </div>
      <div class="page__footer-copyright">
        &copy; {{ site.time | date: '%Y' }} {{ site.author.name | default: site.title }}.
      </div>
    </footer>
  </div>
</footer>
