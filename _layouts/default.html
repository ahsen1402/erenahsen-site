<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="site-wrap header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">Eren’s Home Page</a>
      <nav class="main-nav" aria-label="Main menu">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about-me/' | relative_url }}">About Me</a>
        <details>
          <summary>Competitions</summary>
          <div class="dropdown">
            <a href="{{ '/competitions/' | relative_url }}">Overview</a>
            <a href="{{ '/competitions/fifth-midwest-healthcare-conference-dr-bot-challenge/' | relative_url }}">Fifth Midwest Healthcare Conference Dr. Bot Challenge</a>
            <a href="{{ '/competitions/midwest-healthcare-conference-causal-diagram-challenge-estimating-causal-effects-of-glucocorticoids-on-covid-19-survival/' | relative_url }}">Fourth Midwest Healthcare Conference Causal Diagram Challenge</a>
          </div>
        </details>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/software/' | relative_url }}">Software</a>
        <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
      </nav>
    </div>
  </header>

  <main class="site-wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-wrap">
      <p>© {{ site.time | date: '%Y' }} Eren Ahsen</p>
    </div>
  </footer>
</body>
</html>
