name: Fix research section headings

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize research section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research.md')
          text = p.read_text()
          text = text.replace('## MANUSCRIPTS UNDER REVIEW', '## WORK IN PROGRESS', 1)
          text = text.replace('\n## WORK IN PROGRESS\n\n52. **Ahsen, M. E.**, Ozeken, C., Ayvaci, M.', '\n\n52. **Ahsen, M. E.**, Ozeken, C., Ayvaci, M.', 1)
          p.write_text(text)
          for path in ['research-cv-source.txt', 'research-cleanup-note.txt', '_WIP_update_preview.md']:
              f = Path(path)
              if f.exists():
                  f.unlink()
          Path('.github/workflows/fix-research-section.yml').unlink()
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize research work in progress section [skip ci]"
          git push origin main
